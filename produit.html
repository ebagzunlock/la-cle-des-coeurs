
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Découvrez les détails de nos bijoux et montres LA CLÉ DES CŒURS.">
  <title>Fiche produit | LA CLÉ DES CŒURS</title>
  <link rel="stylesheet" href="styles.css">

  <style>
    .product-page {
      max-width: 1150px;
      margin: 0 auto;
      padding: 45px 20px 75px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 30px;
      color: #806f5d;
      text-decoration: none;
      font-size: 13px;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .product-detail {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 55px;
      align-items: start;
    }

    .product-detail-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #f5f2ed;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      color: #948879;
      font-size: 14px;
    }

    .product-detail-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .product-detail-info {
      padding-top: 15px;
    }

    .detail-brand {
      color: #9a8873;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 15px;
    }

    .detail-name {
      color: #403a33;
      font-size: clamp(25px, 4vw, 36px);
      font-weight: 400;
      line-height: 1.3;
      margin: 0 0 20px;
    }

    .detail-price {
      font-size: 23px;
      color: #403a33;
      margin-bottom: 25px;
    }

    .detail-old-price {
      color: #999;
      text-decoration: line-through;
      font-size: 16px;
      margin-right: 10px;
    }

    .detail-description {
      color: #71695f;
      font-size: 14px;
      line-height: 1.9;
      white-space: pre-line;
      margin-bottom: 25px;
    }

    .detail-reference {
      color: #8b8176;
      font-size: 13px;
      margin-bottom: 25px;
    }

    .detail-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 380px;
    }

    .detail-buttons button {
      width: 100%;
      padding: 15px 20px;
      border: 1px solid #b9a58d;
      background: #b9a58d;
      color: #fff;
      font: inherit;
      font-size: 13px;
      letter-spacing: 1px;
      cursor: pointer;
    }

    .detail-buttons button.secondary {
      background: transparent;
      color: #55493b;
    }

    .detail-buttons button:hover {
      opacity: 0.85;
    }

    .product-message {
      text-align: center;
      padding: 70px 20px;
      color: #71695f;
    }

    .product-message h1 {
      font-weight: 400;
      color: #403a33;
    }

    @media (max-width: 700px) {
      .product-page {
        padding: 25px 15px 50px;
      }

      .product-detail {
        grid-template-columns: 1fr;
        gap: 25px;
      }

      .product-detail-info {
        padding-top: 0;
      }
    }
  </style>
</head>

<body>

  <main class="product-page">
    <a href="catalogue.html" class="back-link">
      ← Retour à la collection
    </a>

    <div id="contenuProduit">
      <p class="product-message">Chargement du produit...</p>
    </div>
  </main>

  <script src="produits.js"></script>

  <script>
    "use strict";

    const contenuProduit = document.getElementById("contenuProduit");

    function echapperHTML(texte) {
      return String(texte ?? "").replace(/[&<>"']/g, function(c) {
        const caracteres = {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        };

        return caracteres[c];
      });
    }

    function formaterPrix(prix) {
      const montant = Number(prix);

      if (!Number.isFinite(montant)) {
        return "Prix sur demande";
      }

      return new Intl.NumberFormat("fr-FR", {
        style: "currency",
        currency: "EUR"
      }).format(montant);
    }

    function lireStock(cle) {
      try {
        const contenu = localStorage.getItem(cle);
        const donnees = contenu ? JSON.parse(contenu) : [];
        return Array.isArray(donnees) ? donnees : [];
      } catch (erreur) {
        console.error(erreur);
        return [];
      }
    }

    function enregistrer(cle, donnees) {
      localStorage.setItem(cle, JSON.stringify(donnees));
    }

    function afficherErreur(message) {
      contenuProduit.innerHTML = `
        <div class="product-message">
          <h1>Produit indisponible</h1>
          <p>${echapperHTML(message)}</p>
          <a href="catalogue.html" class="back-link">
            Retour au catalogue
          </a>
        </div>
      `;
    }

    const parametres = new URLSearchParams(window.location.search);
    const idProduit = parametres.get("id");

    function obtenirProduit() {
      if (!Array.isArray(window.produits)) {
        return null;
      }

      return window.produits.find(function(produit) {
        return produit &&
          produit.actif !== false &&
          String(produit.id) === String(idProduit);
      });
    }

    function ajouterAuPanier(produit) {
      try {
        const panier = lireStock("cdc_cart");

        const existant = panier.find(function(item) {
          return String(item.id) === String(produit.id);
        });

        if (existant) {
          existant.quantity = Number(existant.quantity || 0) + 1;
        } else {
          panier.push({
            id: produit.id,
            name: produit.nom,
            price: Number(produit.prix),
            quantity: 1,
            image: produit.image || ""
          });
        }

        enregistrer("cdc_cart", panier);
        alert("Produit ajouté au panier.");
      } catch (erreur) {
        console.error(erreur);
        alert("Impossible d'enregistrer le panier.");
      }
    }

    function ajouterAuxFavoris(produit) {
      try {
        const favoris = lireStock("cdc_favorites");

        const dejaPresent = favoris.some(function(item) {
          return String(item.id) === String(produit.id);
        });

        if (dejaPresent) {
          alert("Ce produit est déjà dans vos favoris.");
          return;
        }

        favoris.push({
          id: produit.id,
          name: produit.nom,
          price: Number(produit.prix),
          image: produit.image || ""
        });

        enregistrer("cdc_favorites", favoris);
        alert("Produit ajouté à vos favoris.");
      } catch (erreur) {
        console.error(erreur);
        alert("Impossible d'enregistrer les favoris.");
      }
    }

    function afficherProduit(produit) {
      const nom = echapperHTML(produit.nom);
      const marque = echapperHTML(produit.marque || "");
      const description = echapperHTML(
        produit.description || "Découvrez ce modèle de notre sélection LA CLÉ DES CŒURS."
      );
      const reference = echapperHTML(produit.reference || "");
      const image = produit.image ? echapperHTML(produit.image) : "";

      const visuel = image
        ? `<img src="${image}" alt="${nom}">`
        : `<span>Photo à intégrer</span>`;

      const ancienPrix = produit.ancienPrix
        ? `<span class="detail-old-price">${formaterPrix(produit.ancienPrix)}</span>`
        : "";

      document.title = nom + " | LA CLÉ DES CŒURS";

      contenuProduit.innerHTML = `
        <article class="product-detail">
          <div class="product-detail-image">
            ${visuel}
          </div>

          <div class="product-detail-info">
            <div class="detail-brand">${marque}</div>

            <h1 class="detail-name">${nom}</h1>

            <div class="detail-price">
              ${ancienPrix}
              ${formaterPrix(produit.prix)}
            </div>

            ${reference ? `
              <p class="detail-reference">
                Référence : ${reference}
              </p>
            ` : ""}

            <div class="detail-description">${description}</div>

            <div class="detail-buttons">
              <button type="button" id="ajouterPanier">
                AJOUTER AU PANIER
              </button>

              <button type="button" class="secondary" id="ajouterFavoris">
                ♡ AJOUTER AUX FAVORIS
              </button>
            </div>
          </div>
        </article>
      `;

      document.getElementById("ajouterPanier").addEventListener("click", function() {
        ajouterAuPanier(produit);
      });

      document.getElementById("ajouterFavoris").addEventListener("click", function() {
        ajouterAuxFavoris(produit);
      });
    }

    if (!idProduit) {
      afficherErreur("Aucun produit n'a été sélectionné.");
    } else {
      const produit = obtenirProduit();

      if (produit) {
        afficherProduit(produit);
      } else {
        afficherErreur("Ce produit est introuvable dans notre catalogue.");
      }
    }
  </script>

</body>
</html>
