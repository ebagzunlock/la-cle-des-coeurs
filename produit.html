      margin: 0 0 20px;

    .detail-description {

    }

    .detail-reference {
      color: #8b8176;

      margin-bottom: 25px;
    }

    .detail-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 380px;
    }

    .detail-buttons button {
      width: 100%;
      padding: 15px 20px;
      border: 1px solid #b9a58d;
      background: #b9a58d;
      color: #fff;
      font: inherit;
      font-size: 13px;
      letter-spacing: 1px;
      cursor: pointer;
    }

    .detail-buttons button.secondary {
      background: transparent;
      color: #55493b;
    }

    .detail-buttons button:hover {

    }

    .product-message {

    @media (max-width: 700px) {
      .product-page {
        padding: 25px 15px 50px;
      }

        grid-template-columns: 1fr;

      }

      }

    /* Typographie éditoriale des fiches produit */

    .detail-brand, .detail-reference { color: #80623c !important; }

  <script>
    "use strict";

    const contenuProduit = document.getElementById("contenuProduit");

    function echapperHTML(texte) {
      return String(texte ?? "").replace(/[&<>"']/g, function(c) {
        const caracteres = {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        };

        return caracteres[c];
      });
    }

    function formaterPrix(prix) {
      const montant = Number(prix);

      if (prix === null || prix === undefined || prix === "" || !Number.isFinite(montant) || montant <= 0) {
        return "Prix sur demande";
      }

      return new Intl.NumberFormat("fr-FR", {
        style: "currency",
        currency: "EUR"
      }).format(montant);
    }

    function lireStock(cle) {
      try {
        const contenu = localStorage.getItem(cle);
        const donnees = contenu ? JSON.parse(contenu) : [];
        return Array.isArray(donnees) ? donnees : [];
      } catch (erreur) {
        console.error(erreur);
        return [];
      }
    }

    function enregistrer(cle, donnees) {
      localStorage.setItem(cle, JSON.stringify(donnees));
    }

    function afficherErreur(message) {
      contenuProduit.innerHTML = `
        <div class="product-message">
          <h1>Produit indisponible</h1>
          <p>${echapperHTML(message)}</p>
          <a href="catalogue.html" class="back-link">
            Retour au catalogue
          </a>
        </div>
      `;
    }

    const parametres = new URLSearchParams(window.location.search);
    const idProduit = parametres.get("id");

    function obtenirProduit() {
      if (!Array.isArray(window.produits)) {
        return null;
      }

      return window.produits.find(function(produit) {
        return produit &&
          produit.actif !== false &&
          String(produit.id) === String(idProduit);
      });
    }

    function ajouterAuPanier(produit) {
      try {
        const panier = lireStock("cdc_cart");

        const existant = panier.find(function(item) {
          return String(item.id) === String(produit.id);
        });

        if (existant) {
          existant.quantity = Number(existant.quantity || 0) + 1;
        } else {
          panier.push({
            id: produit.id,
            name: produit.nom,
            price: Number(produit.prix),
            quantity: 1,
            image: produit.image || ""
          });
        }

        enregistrer("cdc_cart", panier);
        alert("Produit ajouté au panier.");
      } catch (erreur) {
        console.error(erreur);
        alert("Impossible d'enregistrer le panier.");
      }
    }

    function ajouterAuxFavoris(produit) {
      try {
        const favoris = lireStock("cdc_favorites");

        const dejaPresent = favoris.some(function(item) {
          return String(item.id) === String(produit.id);
        });

        if (dejaPresent) {
          alert("Ce produit est déjà dans vos favoris.");
          return;
        }

        favoris.push({
          id: produit.id,
          name: produit.nom,
          price: Number(produit.prix),
          image: produit.image || ""
        });

        enregistrer("cdc_favorites", favoris);
        alert("Produit ajouté à vos favoris.");
      } catch (erreur) {
        console.error(erreur);
        alert("Impossible d'enregistrer les favoris.");
      }
    }

    function afficherProduit(produit) {
      const nom = echapperHTML(produit.nom);
      const marque = echapperHTML(produit.marque || "");
      const description = echapperHTML(
        produit.description || "Découvrez ce modèle de notre sélection LA CLÉ DES CŒURS."
      );
      const reference = echapperHTML(produit.reference || "");

      const images = [
        ...new Set(
          (Array.isArray(produit.images) ? produit.images : [])
            .filter(Boolean)
        )
      ];

      if (produit.image && !images.includes(produit.image)) {
        images.unshift(produit.image);
      }

      const premiereImage = images[0] || "";

      // La première image est déjà affichée en grand.
      // On ne la répète donc pas dans les miniatures.
      const imagesMiniatures = images.slice(1);

      const ancienPrix = produit.ancienPrix
        ? `<span class="detail-old-price">${formaterPrix(produit.ancienPrix)}</span>`
        : "";

      document.title = nom + " | LA CLÉ DES CŒURS";

      contenuProduit.innerHTML = `
        <article class="product-detail">

          <div class="product-gallery">
            <div class="product-detail-image">
              ${images.length
                ? images.map((url, index) => `
                    <img
                      src="${echapperHTML(url)}"
                      alt="${nom} - photo ${index + 1}"
                      loading="eager"
                    >
                  `).join("")
                : `<span>Photo à intégrer</span>`
              }
            </div>
          </div>

          <div class="product-detail-info">
            <div class="detail-brand">${marque}</div>

            <h1 class="detail-name">${nom}</h1>

            <div class="detail-price">
              ${ancienPrix}
              ${formaterPrix(produit.prix)}
            </div>

            ${reference ? `
              <p class="detail-reference">
                Référence : ${reference}
              </p>
            ` : ""}

            <div class="detail-description">${description}</div>

            <div class="detail-buttons">
              <button type="button" id="ajouterPanier" ${Number(produit.prix) > 0 ? "" : "disabled"}>
                ${Number(produit.prix) > 0 ? "AJOUTER AU PANIER" : "PRIX À CONFIRMER"}
              </button>

              <button type="button" class="secondary" id="ajouterFavoris">
                ♡ AJOUTER AUX FAVORIS
              </button>
            </div>
          </div>

        </article>
      `;

      document.querySelectorAll(".product-thumbnail").forEach(function(bouton) {
        bouton.addEventListener("click", function() {
          const index = Number(bouton.dataset.index);
          const image = images[index];
          const photoPrincipale = document.getElementById("photoPrincipale");

          if (image && photoPrincipale) {
            photoPrincipale.src = image;

            document.querySelectorAll(".product-thumbnail").forEach(function(element) {
              element.classList.remove("active");
            });

            bouton.classList.add("active");
          }
        });
      });

      document.getElementById("ajouterPanier").addEventListener("click", function() {
        ajouterAuPanier(produit);
      });

      document.getElementById("ajouterFavoris").addEventListener("click", function() {
        ajouterAuxFavoris(produit);
      });
    }

    if (!idProduit) {
      afficherErreur("Aucun produit n'a été sélectionné.");
    } else if (!window.produitsReady) {
      afficherErreur("Le catalogue n'a pas pu démarrer.");
    } else {
      window.produitsReady
        .then(function() {
          const produit = obtenirProduit();

          if (produit) {
            afficherProduit(produit);
          } else {
            afficherErreur("Ce produit est introuvable dans notre catalogue.");
          }
        })
        .catch(function(erreur) {
          console.error(erreur);
          afficherErreur("Impossible de charger le catalogue. Réessayez plus tard.");
        });
    }
  </script>

<script id="cdc-active-navigation-20261107">
(() => {
 const page=(location.pathname.split("/").pop()||"index.html").toLowerCase();
 if(page==="index.html"&&location.hash==="#searchForm"){const searchInput=document.getElementById("searchInput");if(searchInput)searchInput.focus();}
 const targets={"compte.html":"compte","favoris.html":"favoris","panier.html":"panier"};
 document.querySelectorAll(".header-actions a").forEach(link=>{const href=(link.getAttribute("href")||"").split("?")[0].toLowerCase();const key=targets[page];if(key&&href===key+".html")link.setAttribute("aria-current","page");});
 document.querySelectorAll(".main-nav a").forEach(link=>{const href=(link.getAttribute("href")||"").split("?")[0].toLowerCase();if(href===page||(page==="produit.html"&&href==="catalogue.html"))link.setAttribute("aria-current","page");});
 const search=document.querySelector(".header-search-form");if(search){const input=search.querySelector("input");if(input){input.addEventListener("focus",()=>search.setAttribute("aria-current","page"));input.addEventListener("blur",()=>search.removeAttribute("aria-current"));}}
})();
</script>
<script id="cdc-universal-navigation">
(() => {
  const button = document.getElementById("menuButton");
  const nav = document.getElementById("mainNav");
  if (button && nav && !button.dataset.cdcMenuReady) {
    button.dataset.cdcMenuReady = "true";
    button.addEventListener("click", () => {
      const open = nav.classList.toggle("is-open");
      button.setAttribute("aria-expanded", String(open));
      button.setAttribute("aria-label", open ? "Fermer le menu" : "Ouvrir le menu");
      button.innerHTML = open
        ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>'
        : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>';
    });
    nav.querySelectorAll("a").forEach(link => link.addEventListener("click", () => {
      nav.classList.remove("is-open");
      button.setAttribute("aria-expanded","false");
      button.setAttribute("aria-label","Ouvrir le menu");
    }));
  }
})();
</script>

<script id="cdc-page-location-20261107">
(function(){
  const path=(location.pathname.split("/").pop()||"index.html").toLowerCase();
  const params=new URLSearchParams(location.search);
  const category=(params.get("categorie")||params.get("category")||"").toLowerCase();
  const labels={
    "index.html":"Accueil","catalogue.html":"Tout le catalogue","produit.html":"Fiche produit",
    "panier.html":"Mon panier","commande.html":"Finaliser ma commande","compte.html":"Mon compte",
    "favoris.html":"Mes favoris","contact.html":"Contact","qui-sommes-nous.html":"Qui sommes-nous",
    "conditions-generales.html":"Conditions générales de vente","confidentialite.html":"Politique de confidentialité",
    "livraison-retours.html":"Livraison et retours","mentions-legales.html":"Mentions légales"
  };
  const categoryLabels={homme:"Montres homme",femme:"Montres femme",accessoires:"Accessoires et bracelets",bracelets:"Accessoires et bracelets",ap:"AP x Swatch", "ap-swatch":"AP x Swatch"};
  const links=[...document.querySelectorAll(".main-nav a")];
  let currentLabel=labels[path]||"Page";
  if(path==="catalogue.html"&&categoryLabels[category]) currentLabel=categoryLabels[category];
  links.forEach(link=>{
    const href=(link.getAttribute("href")||"").toLowerCase();
    let active=false;
    if(path==="index.html") active=href==="index.html";
    else if(path==="catalogue.html"&&categoryLabels[category]){
      active=href.includes("categorie="+encodeURIComponent(category)) ||
        (category==="bracelets"&&href.includes("categorie=accessoires"));
    } else if(path==="catalogue.html") active=href==="catalogue.html";
    else if(path==="produit.html") active=href.startsWith("catalogue.html");
    else active=href.split("?")[0]===path;
    if(active){link.setAttribute("aria-current","page");link.classList.add("is-current");}
    else {link.removeAttribute("aria-current");link.classList.remove("is-current");}
  });
})();
</script>
