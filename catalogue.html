
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Découvrez les bijoux et montres LA CLÉ DES CŒURS.">
  <title>Notre catalogue | LA CLÉ DES CŒURS</title>
  <link rel="stylesheet" href="styles.css?v=cdc-logo-contrast-20261107-9">

  <style>
    .catalogue-page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px 70px;
    }

    .catalogue-heading {
      text-align: center;
      margin-bottom: 35px;
    }

    .catalogue-heading h1 {
      font-size: clamp(28px, 4vw, 42px);
      font-weight: 400;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    .catalogue-heading p {
      color: #777;
      font-size: 14px;
    }

    .catalogue-filters {
      display: grid;
      grid-template-columns: 2fr 1.2fr 1fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 30px;
    }

    .catalogue-filters input,
    .catalogue-filters select {
      width: 100%;
      min-width: 0;
      padding: 13px 14px;
      border: 1px solid #ded8ce;
      background: #fff;
      color: #403a33;
      font: inherit;
    }

    .catalogue-count {
      color: #777;
      font-size: 13px;
      margin-bottom: 20px;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 28px 22px;
    }

    .product-card {
      min-width: 0;
      border: 1px solid #eee9e1;
      background: #fff;
      padding-bottom: 18px;
      text-align: center;
    }

    .product-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #f5f2ed;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      color: #948879;
      font-size: 13px;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .product-info {
      padding: 17px 15px 0;
    }

    .product-brand {
      color: #9a8873;
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .product-name {
      font-size: 15px;
      font-weight: 400;
      line-height: 1.5;
      margin: 0 0 10px;
      color: #403a33;
    }

    .product-name a {
      color: inherit;
      text-decoration: none;
    }

    .product-name a:hover {
      color: #9a8873;
    }

    .product-price {
      font-size: 16px;
      color: #403a33;
      margin-bottom: 15px;
    }

    .product-old-price {
      color: #999;
      text-decoration: line-through;
      font-size: 13px;
      margin-right: 8px;
    }

    .product-actions {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .product-actions button {
      border: 1px solid #b9a58d;
      background: transparent;
      color: #55493b;
      padding: 10px 13px;
      font-size: 12px;
      cursor: pointer;
    }

    .product-actions button:hover {
      background: #b9a58d;
      color: #fff;
    }

    .no-products {
      grid-column: 1 / -1;
      text-align: center;
      padding: 45px 15px;
      color: #777;
    }

    @media (max-width: 800px) {
      .products-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .catalogue-filters {
        grid-template-columns: 1fr 1fr;
      }

      .catalogue-filters input {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 520px) {
      .catalogue-page {
        padding: 28px 14px 50px;
      }

      .products-grid {
        gap: 15px 10px;
      }

      .catalogue-filters {
        grid-template-columns: 1fr;
      }

      .catalogue-filters input {
        grid-column: auto;
      }

      .product-info {
        padding-left: 9px;
        padding-right: 9px;
      }
    }
  
    .header-cart-icon { width: 22px; height: 22px; display: inline-block; vertical-align: middle; }
  </style>
</head>

<body>
  <div class="announcement">BIENVENUE CHEZ LA CLÉ DES CŒURS</div>
  <header class="header">
    <div></div>
    <a href="index.html" class="brand brand-home-link" title="Retour à l’accueil" aria-label="LA CLÉ DES CŒURS — Accueil">
      <span class="brand-monogram" aria-label="Monogramme CDC avec une clé"><span class="brand-initials">CDC</span><svg viewBox="0 0 96 20" aria-hidden="true" focusable="false"><circle cx="10" cy="10" r="6.2" fill="none" stroke="currentColor" stroke-width="1.15"/><path d="M16.5 10H91m-9 0v5m-8-5v4m-8-4v5" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round"/><path d="M43 5.5h10" fill="none" stroke="currentColor" stroke-width=".7" opacity=".65"/></svg></span>
      <span class="brand-name">LA CLÉ DES CŒURS</span>
      <span class="brand-tagline">BIJOUX FINS &amp; RAFFINÉS</span>
    </a>
    <div class="header-actions">
      <a class="header-search-link" href="index.html#searchForm" aria-label="Rechercher" title="Rechercher"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.8" cy="10.8" r="6.5"/><path d="m16 16 4.5 4.5"/></svg></a>
      <a href="compte.html" aria-label="Mon compte" title="Mon compte"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.2"/><path d="M5.5 20c.7-3.4 3-5.2 6.5-5.2s5.8 1.8 6.5 5.2"/></svg></a>
      <a href="favoris.html" aria-label="Favoris"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20.4 8.8c0 4.2-8.4 10-8.4 10S3.6 13 3.6 8.8A4.3 4.3 0 0 1 12 6.5a4.3 4.3 0 0 1 8.4 2.3Z"/></svg></a>
      <a href="panier.html" aria-label="Panier" aria-label="Panier"><svg class="header-cart-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.2 11.2a2 2 0 0 0 2 1.6h8.9a2 2 0 0 0 1.9-1.4L22 8H6"></path><circle cx="10" cy="20" r="1"></circle><circle cx="18" cy="20" r="1"></circle></svg></a>
    </div>
  </header>
  <nav class="main-nav" aria-label="Navigation principale">
    <a href="index.html">Accueil</a>
    <a href="catalogue.html">Catalogue</a>
    <a href="qui-sommes-nous.html">Qui sommes-nous</a>
    <a href="contact.html">Contact</a>

  <main class="catalogue-page">
    <header class="catalogue-heading">
      <h1>Notre collection</h1>
      <p>Découvrez notre sélection de bijoux et de montres.</p>
    </header>

    <section class="catalogue-filters" aria-label="Filtres du catalogue">
      <input
        type="search"
        id="recherche"
        placeholder="Rechercher un produit ou une marque..."
        aria-label="Rechercher un produit"
      >

      <select id="filtreCategorie" aria-label="Filtrer par catégorie">
        <option value="">Toutes les catégories</option>
        <option value="accessoires">Accessoires et bracelets</option>
        <option value="ap-swatch">AP x Swatch</option>
        <option value="femme">Montres femme</option>
        <option value="homme">Montres homme</option>
      </select>

      <label class="price-filter" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
        Prix min €
        <input id="prixMinimum" type="number" min="0" step="1" inputmode="decimal" placeholder="0" aria-label="Prix minimum" style="width:95px;padding:10px;">
        Prix max €
        <input id="prixMaximum" type="number" min="0" step="1" inputmode="decimal" placeholder="Illimité" aria-label="Prix maximum" style="width:105px;padding:10px;">
      </label>

      <select id="filtreDisponibilite" aria-label="Filtrer par disponibilité">
        <option value="">Tous les stocks</option>
        <option value="stock">En stock</option>
        <option value="rupture">Indisponibles</option>
      </select>

      <select id="filtrePromotion" aria-label="Filtrer les promotions">
        <option value="">Toutes les offres</option>
        <option value="promo">En promotion</option>
      </select>

      <select id="triProduits" aria-label="Trier les produits">
        <option value="recent">Ordre d'affichage</option>
        <option value="prix-croissant">Prix croissant</option>
        <option value="prix-decroissant">Prix décroissant</option>
        <option value="nom">Nom A à Z</option>
        <option value="note">Mieux notés</option>
      </select>
    </section>

    <p class="catalogue-count" id="nombreProduits">
      Chargement des produits...
    </p>

    <section class="products-grid" id="listeProduits" aria-live="polite">
      <p class="no-products">Chargement du catalogue...</p>
    </section>
  </main>

  <script src="produits.js?v=description-cleanup-20261107-7"></script>

  <script>
    "use strict";

    const listeProduits = document.getElementById("listeProduits");
    const recherche = document.getElementById("recherche");
    const filtreCategorie = document.getElementById("filtreCategorie");
    const triProduits = document.getElementById("triProduits");
    const filtreDisponibilite = document.getElementById("filtreDisponibilite");
    const filtrePromotion = document.getElementById("filtrePromotion");
    const prixMinimum = document.getElementById("prixMinimum");
    const prixMaximum = document.getElementById("prixMaximum");
    const nombreProduits = document.getElementById("nombreProduits");

    const parametres = new URLSearchParams(window.location.search);
    const categorieDemandee = parametres.get("categorie");
    const rechercheDemandee = parametres.get("recherche");

    if (categorieDemandee) {
      const optionExiste = Array.from(filtreCategorie.options)
        .some(option => option.value === categorieDemandee);

      if (optionExiste) {
        filtreCategorie.value = categorieDemandee;
      }
    }

    if (rechercheDemandee) {
      recherche.value = rechercheDemandee;
    }

    function lireStock(cle) {
      try {
        const contenu = localStorage.getItem(cle);
        const donnees = contenu ? JSON.parse(contenu) : [];
        return Array.isArray(donnees) ? donnees : [];
      } catch (erreur) {
        console.error(erreur);
        return [];
      }
    }

    function enregistrer(cle, donnees) {
      localStorage.setItem(cle, JSON.stringify(donnees));
    }

    function formaterPrix(prix) {
      const montant = Number(prix);

      if (prix === null || prix === undefined || prix === "" || !Number.isFinite(montant) || montant <= 0) {
        return "Prix sur demande";
      }

      return new Intl.NumberFormat("fr-FR", {
        style: "currency",
        currency: "EUR"
      }).format(montant);
    }

    function echapperHTML(texte) {
      return String(texte ?? "").replace(/[&<>"']/g, function(c) {
        const caracteres = {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        };

        return caracteres[c];
      });
    }

    function obtenirProduits() {
      if (!Array.isArray(window.produits)) return [];

      return window.produits.filter(function(produit) {
        return produit && produit.actif !== false;
      });
    }

    function afficherProduits() {
      let produits = obtenirProduits();

      const terme = recherche.value.trim().toLowerCase();
      const categorie = filtreCategorie.value;
      const tri = triProduits.value;
      const disponibilite = filtreDisponibilite.value;
      const promotion = filtrePromotion.value;
      const minPrix = prixMinimum.value === "" ? null : Number(prixMinimum.value);
      const maxPrix = prixMaximum.value === "" ? null : Number(prixMaximum.value);

      if (terme) {
        produits = produits.filter(function(produit) {
          const texte = [
            produit.nom,
            produit.marque,
            produit.reference,
            produit.description
          ].join(" ").toLowerCase();

          return texte.includes(terme);
        });
      }

      if (categorie) {
        produits = produits.filter(function(produit) {
          if (Array.isArray(produit.categories)) {
            return produit.categories.includes(categorie);
          }

          return produit.categorie === categorie;
        });
      }

      if (disponibilite === "stock") {
        produits = produits.filter(produit => produit.enStock !== false);
      }

      if (disponibilite === "rupture") {
        produits = produits.filter(produit => produit.enStock === false);
      }

      if (promotion === "promo") {
        produits = produits.filter(produit => produit.enPromo === true);
      }

      if (minPrix !== null && Number.isFinite(minPrix)) {
        produits = produits.filter(produit => Number(produit.prix) >= minPrix);
      }

      if (maxPrix !== null && Number.isFinite(maxPrix)) {
        produits = produits.filter(produit => Number(produit.prix) <= maxPrix);
      }

      if (tri === "prix-croissant") {
        produits.sort((a, b) => {
          const prixA = Number(a.prix) > 0 ? Number(a.prix) : Number.POSITIVE_INFINITY;
          const prixB = Number(b.prix) > 0 ? Number(b.prix) : Number.POSITIVE_INFINITY;
          return prixA - prixB;
        });
      }

      if (tri === "prix-decroissant") {
        produits.sort((a, b) => {
          const prixA = Number(a.prix) > 0 ? Number(a.prix) : Number.NEGATIVE_INFINITY;
          const prixB = Number(b.prix) > 0 ? Number(b.prix) : Number.NEGATIVE_INFINITY;
          return prixB - prixA;
        });
      }

      if (tri === "nom") {
        produits.sort((a, b) =>
          String(a.nom).localeCompare(String(b.nom), "fr")
        );
      }

      if (tri === "note") {
        produits.sort((a, b) => Number(b.note || 0) - Number(a.note || 0));
      }

      nombreProduits.textContent =
        produits.length + (produits.length > 1 ? " produits" : " produit");

      if (produits.length === 0) {
        listeProduits.innerHTML =
          '<p class="no-products">Aucun produit ne correspond à votre recherche.</p>';
        return;
      }

      listeProduits.innerHTML = produits.map(function(produit) {
        const id = echapperHTML(produit.id);
        const nom = echapperHTML(produit.nom);
        const marque = echapperHTML(produit.marque || "");
        const image = produit.image ? echapperHTML(produit.image) : "";
        const prix = formaterPrix(produit.prix);
        const lienProduit =
          "produit.html?id=" + encodeURIComponent(produit.id);

        const ancienPrix = produit.ancienPrix
          ? '<span class="product-old-price">' +
            formaterPrix(produit.ancienPrix) +
            '</span>'
          : "";

        const visuel = image
          ? '<img src="' + image + '" alt="' + nom + '" loading="lazy">'
          : '<span>Photo à intégrer</span>';

        return `
          <article class="product-card">
            <a href="${lienProduit}" class="product-image" aria-label="Voir ${nom}">
              ${visuel}
            </a>

            <div class="product-info">
              <div class="product-brand">${marque}</div>

              <h2 class="product-name">
                <a href="${lienProduit}">${nom}</a>
              </h2>

              <div class="product-price">
                ${ancienPrix}
                ${prix}
              </div>

              <div class="product-actions">
                <button type="button" data-action="panier" data-id="${id}">
                  Ajouter au panier
                </button>

                <button type="button" data-action="favoris" data-id="${id}">
                  ♡ Favoris
                </button>
              </div>
            </div>
          </article>
        `;
      }).join("");
    }

    function ajouterAuPanier(id) {
      const produit = obtenirProduits().find(item =>
        String(item.id) === String(id)
      );

      if (!produit) {
        alert("Produit introuvable.");
        return;
      }

      try {
        const panier = lireStock("cdc_cart");

        const existant = panier.find(item =>
          String(item.id) === String(produit.id)
        );

        if (existant) {
          existant.quantity = Number(existant.quantity || 0) + 1;
        } else {
          panier.push({
            id: produit.id,
            name: produit.nom,
            price: Number(produit.prix),
            quantity: 1,
            image: produit.image || ""
          });
        }

        enregistrer("cdc_cart", panier);
        alert("Produit ajouté au panier.");
      } catch (erreur) {
        console.error(erreur);
        alert("Impossible d'enregistrer le panier.");
      }
    }

    function ajouterAuxFavoris(id) {
      const produit = obtenirProduits().find(item =>
        String(item.id) === String(id)
      );

      if (!produit) {
        alert("Produit introuvable.");
        return;
      }

      try {
        const favoris = lireStock("cdc_favorites");

        const dejaPresent = favoris.some(item =>
          String(item.id) === String(produit.id)
        );

        if (dejaPresent) {
          alert("Ce produit est déjà dans vos favoris.");
          return;
        }

        favoris.push({
          id: produit.id,
          name: produit.nom,
          price: Number(produit.prix),
          image: produit.image || ""
        });

        enregistrer("cdc_favorites", favoris);
        alert("Produit ajouté à vos favoris.");
      } catch (erreur) {
        console.error(erreur);
        alert("Impossible d'enregistrer les favoris.");
      }
    }

    listeProduits.addEventListener("click", function(evenement) {
      const bouton = evenement.target.closest("button[data-action]");

      if (!bouton) return;

      const id = bouton.dataset.id;

      if (bouton.dataset.action === "panier") {
        ajouterAuPanier(id);
      }

      if (bouton.dataset.action === "favoris") {
        ajouterAuxFavoris(id);
      }
    });

    recherche.addEventListener("input", afficherProduits);
    filtreCategorie.addEventListener("change", afficherProduits);
    triProduits.addEventListener("change", afficherProduits);
    filtreDisponibilite.addEventListener("change", afficherProduits);
    filtrePromotion.addEventListener("change", afficherProduits);
    prixMinimum.addEventListener("input", afficherProduits);
    prixMaximum.addEventListener("input", afficherProduits);

    // Attendre le chargement du catalogue original
    if (window.produitsReady) {
      window.produitsReady
        .then(() => {
          afficherProduits();
        })
        .catch((erreur) => {
          console.error("Erreur de chargement :", erreur);
          nombreProduits.textContent = "Catalogue indisponible";
          listeProduits.innerHTML =
            '<p class="no-products">Impossible de charger les produits. Réessayez plus tard.</p>';
        });
    } else {
      nombreProduits.textContent = "Catalogue indisponible";
      listeProduits.innerHTML =
        '<p class="no-products">Le fichier produits.js n’a pas été chargé.</p>';
    }
  </script>
  <script src="langue.js?v=identite-lisible-20261107-1"></script>

<script id="cdc-active-navigation-20261107">
(() => {
  const page = (location.pathname.split("/").pop() || "index.html").toLowerCase();
  const targets = { "compte.html":"compte", "favoris.html":"favoris", "panier.html":"panier" };
  document.querySelectorAll(".header-actions a").forEach(link => {
    const href = (link.getAttribute("href") || "").split("?")[0].toLowerCase();
    const key = targets[page];
    if (key && href === key + ".html") link.setAttribute("aria-current", "page");
  });
  document.querySelectorAll(".main-nav a").forEach(link => {
    const href = (link.getAttribute("href") || "").split("?")[0].toLowerCase();
    if (href === page) link.setAttribute("aria-current", "page");
    else if (page === "produit.html" && href === "catalogue.html") link.setAttribute("aria-current", "page");
  });
  const search = document.querySelector(".header-search-form");
  if (search) {
    const input = search.querySelector("input");
    if (input) input.addEventListener("focus", () => search.setAttribute("aria-current", "page"));
    if (input) input.addEventListener("blur", () => search.removeAttribute("aria-current"));
  }
})();
</script>
