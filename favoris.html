    .favorite-image img {

      height: 100%;

    }

    .favorite-info {
      padding: 15px;
    }

    .favorite-info h2 {
      font-family: Georgia, serif;
      font-size: 17px;
      font-weight: 400;
      margin: 0 0 8px;
    }

    .favorite-price {
      color: #806b54;
      font-weight: 600;
      margin: 10px 0;
    }

    .favorite-actions {
      display: flex;
      gap: 8px;
      margin-top: 15px;
    }

    .favorite-actions button {
      flex: 1;
      padding: 11px 8px;
      cursor: pointer;
      border: 1px solid #9b856d;
      font-size: 11px;
      letter-spacing: .5px;
    }

    .add-cart {
      background: #8b745c;
      color: white;
    }

    .remove-favorite {

      color: #6e5b49;
    }

    .empty-favorites {
      text-align: center;
      padding: 65px 20px;
      background: #faf8f4;
      border: 1px solid #eee6dc;
    }

    .empty-favorites h2 {
      font-family: Georgia, serif;
      font-weight: 400;
    }

    .empty-favorites a {
      display: inline-block;
      margin-top: 15px;
      padding: 13px 24px;
      background: #8b745c;
      color: white;
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 1px;
    }

    @media (max-width: 800px) {
      .favorites-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 520px) {

        grid-template-columns: 1fr;
      }

      .favorite-image {
        height: 250px;
      }
    }

  <main class="favorites-page">

    <header class="favorites-heading">
      <p>LA CLÉ DES CŒURS</p>
      <h1>Mes favoris</h1>
      <p>Vos coups de cœur, réunis au même endroit.</p>
    </header>

    <div id="favoritesContainer"></div>

  </main>

  <script>
    const FAVORITES_KEY = "cdc_favorites";
    const CART_KEY = "cdc_cart";

    function getFavorites() {
      try {
        const data = JSON.parse(localStorage.getItem(FAVORITES_KEY) || "[]");
        return Array.isArray(data) ? data : [];
      } catch {
        return [];
      }
    }

    function saveFavorites(items) {
      localStorage.setItem(FAVORITES_KEY, JSON.stringify(items));
    }

    function getCart() {
      try {
        const data = JSON.parse(localStorage.getItem(CART_KEY) || "[]");
        return Array.isArray(data) ? data : [];
      } catch {
        return [];
      }
    }

    function saveCart(items) {
      localStorage.setItem(CART_KEY, JSON.stringify(items));
    }

    function formatPrice(price) {
      return Number(price).toLocaleString("fr-FR", {
        style: "currency",
        currency: "EUR"
      });
    }

    function renderFavorites() {
      const favorites = getFavorites();
      const container = document.getElementById("favoritesContainer");

      container.replaceChildren();

      if (favorites.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-favorites";

        const heading = document.createElement("h2");
        heading.textContent = "Votre liste est encore vide";

        const message = document.createElement("p");
        message.textContent = "Découvrez notre collection et ajoutez vos articles préférés.";

        const link = document.createElement("a");
        link.href = "catalogue.html";
        link.textContent = "DÉCOUVRIR LA COLLECTION";

        empty.append(heading, message, link);
        container.appendChild(empty);
        return;
      }

      const grid = document.createElement("div");
      grid.className = "favorites-grid";

      favorites.forEach((product, index) => {
        const card = document.createElement("article");
        card.className = "favorite-card";

        const imageArea = document.createElement("div");
        imageArea.className = "favorite-image";

        if (product.image) {
          const image = document.createElement("img");
          image.src = product.image;
          image.alt = product.name || "Article favori";
          imageArea.appendChild(image);
        } else {
          imageArea.textContent = "LA CLÉ DES CŒURS";
        }

        const info = document.createElement("div");
        info.className = "favorite-info";

        const name = document.createElement("h2");
        name.textContent = product.name || "Article";

        const price = document.createElement("p");
        price.className = "favorite-price";

        const numericPrice = Number(product.price);
        price.textContent = Number.isFinite(numericPrice)
          ? formatPrice(numericPrice)
          : "Prix à confirmer";

        const actions = document.createElement("div");
        actions.className = "favorite-actions";

        const addButton = document.createElement("button");
        addButton.className = "add-cart";
        addButton.textContent = "AJOUTER AU PANIER";
        addButton.addEventListener("click", () => addToCart(product));

        const removeButton = document.createElement("button");
        removeButton.className = "remove-favorite";
        removeButton.textContent = "RETIRER";
        removeButton.addEventListener("click", () => removeFavorite(index));

        actions.append(addButton, removeButton);
        info.append(name, price, actions);
        card.append(imageArea, info);
        grid.appendChild(card);
      });

      container.appendChild(grid);
    }

    function addToCart(product) {
      const price = Number(product.price);

      if (!Number.isFinite(price) || price < 0) {
        alert("Le prix de cet article doit être vérifié avant l'ajout au panier.");
        return;
      }

      const cart = getCart();
      const existing = cart.find(item => String(item.id || "") === String(product.id || "") && item.name === product.name);

      if (existing) {
        existing.quantity = Number(existing.quantity || 0) + 1;
      } else {
        cart.push({
          id: product.id || "",
          name: product.name || "Article",
          price: price,
          quantity: 1,
          image: product.image || ""
        });
      }

      saveCart(cart);
      alert("Article ajouté au panier.");
    }

    function removeFavorite(index) {
      const favorites = getFavorites();
      favorites.splice(index, 1);
      saveFavorites(favorites);
      renderFavorites();
    }

    renderFavorites();
  </script>

<script id="cdc-active-navigation-20261107">
(() => {
 const page=(location.pathname.split("/").pop()||"index.html").toLowerCase();
 if(page==="index.html"&&location.hash==="#searchForm"){const searchInput=document.getElementById("searchInput");if(searchInput)searchInput.focus();}
 const targets={"compte.html":"compte","favoris.html":"favoris","panier.html":"panier"};
 document.querySelectorAll(".header-actions a").forEach(link=>{const href=(link.getAttribute("href")||"").split("?")[0].toLowerCase();const key=targets[page];if(key&&href===key+".html")link.setAttribute("aria-current","page");});
 document.querySelectorAll(".main-nav a").forEach(link=>{const href=(link.getAttribute("href")||"").split("?")[0].toLowerCase();if(href===page||(page==="produit.html"&&href==="catalogue.html"))link.setAttribute("aria-current","page");});
 const search=document.querySelector(".header-search-form");if(search){const input=search.querySelector("input");if(input){input.addEventListener("focus",()=>search.setAttribute("aria-current","page"));input.addEventListener("blur",()=>search.removeAttribute("aria-current"));}}
})();
</script>
<script id="cdc-universal-navigation">
(() => {
  const button = document.getElementById("menuButton");
  const nav = document.getElementById("mainNav");
  if (button && nav && !button.dataset.cdcMenuReady) {
    button.dataset.cdcMenuReady = "true";
    button.addEventListener("click", () => {
      const open = nav.classList.toggle("is-open");
      button.setAttribute("aria-expanded", String(open));
      button.setAttribute("aria-label", open ? "Fermer le menu" : "Ouvrir le menu");
      button.innerHTML = open
        ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>'
        : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>';
    });
    nav.querySelectorAll("a").forEach(link => link.addEventListener("click", () => {
      nav.classList.remove("is-open");
      button.setAttribute("aria-expanded","false");
      button.setAttribute("aria-label","Ouvrir le menu");
    }));
  }
})();
</script>

<script id="cdc-page-location-20261107">
(function(){
  const path=(location.pathname.split("/").pop()||"index.html").toLowerCase();
  const params=new URLSearchParams(location.search);
  const category=(params.get("categorie")||params.get("category")||"").toLowerCase();
  const labels={
    "index.html":"Accueil","catalogue.html":"Tout le catalogue","produit.html":"Fiche produit",
    "panier.html":"Mon panier","commande.html":"Finaliser ma commande","compte.html":"Mon compte",
    "favoris.html":"Mes favoris","contact.html":"Contact","qui-sommes-nous.html":"Qui sommes-nous",
    "conditions-generales.html":"Conditions générales de vente","confidentialite.html":"Politique de confidentialité",
    "livraison-retours.html":"Livraison et retours","mentions-legales.html":"Mentions légales"
  };
  const categoryLabels={homme:"Montres homme",femme:"Montres femme",accessoires:"Accessoires et bracelets",bracelets:"Accessoires et bracelets",ap:"AP x Swatch", "ap-swatch":"AP x Swatch"};
  const links=[...document.querySelectorAll(".main-nav a")];
  let currentLabel=labels[path]||"Page";
  if(path==="catalogue.html"&&categoryLabels[category]) currentLabel=categoryLabels[category];
  links.forEach(link=>{
    const href=(link.getAttribute("href")||"").toLowerCase();
    let active=false;
    if(path==="index.html") active=href==="index.html";
    else if(path==="catalogue.html"&&categoryLabels[category]){
      active=href.includes("categorie="+encodeURIComponent(category)) ||
        (category==="bracelets"&&href.includes("categorie=accessoires"));
    } else if(path==="catalogue.html") active=href==="catalogue.html";
    else if(path==="produit.html") active=href.startsWith("catalogue.html");
    else active=href.split("?")[0]===path;
    if(active){link.setAttribute("aria-current","page");link.classList.add("is-current");}
    else {link.removeAttribute("aria-current");link.classList.remove("is-current");}
  });
})();
</script>
